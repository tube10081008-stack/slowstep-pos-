<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920" />
<title>슬로우스텝 · 메뉴판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 슬로우스텝 메뉴판 — 1920×1080 고객 화면.
     크기는 vh/vw 로 잡는다. 1080p에 맞춰 두되 다른 해상도에서도 비율이 유지된다.
     (px로 박으면 모니터를 바꾸는 순간 잘린다) */
  :root {
    --bg:#17110E;          /* 다크 에스프레소 */
    --ink:#F2E7DC;         /* 웜 크림 */
    --ink-hi:#F6EDE3;
    --amber:#E8B98F;       /* 가격 */
    --tan:#C98A5E;         /* 부제 */
    --terra:#C4593C;       /* 배지 */
    --line:rgba(242,231,220,.14);
    --line2:rgba(242,231,220,.20);
    --mute:rgba(242,231,220,.55);
    --mute2:rgba(242,231,220,.78);
    --serif:'Instrument Serif', 'Noto Serif KR', Georgia, serif;
    --sans:Pretendard, 'Noto Serif KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden; }
  body { color:var(--ink); font-family:var(--sans); user-select:none;
    -webkit-font-smoothing:antialiased; }

  .board { position:relative; height:100vh; display:grid;
    grid-template-rows:11.1vh 1fr 10vh; overflow:hidden; }
  /* 왼쪽 위에서 번지는 로스팅 불빛 */
  .board::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 10% 0%, rgba(190,96,58,.15), transparent 62%); }

  /* ── 머리 ── */
  .top { display:flex; align-items:center; justify-content:space-between;
    padding:0 3.75vw; border-bottom:1px solid var(--line); position:relative; }
  .brand { display:flex; align-items:baseline; gap:1.35vw; }
  .brand .n { font-family:var(--serif); font-size:5.4vh; letter-spacing:.12em;
    line-height:1; color:var(--ink-hi); }
  .brand .s { font-family:var(--serif); font-style:italic; font-size:2.5vh;
    color:var(--tan); letter-spacing:.04em; }
  .tabs { display:flex; gap:.73vw; align-items:center; }
  .tabs button { font-family:inherit; padding:1.3vh 1.35vw; border-radius:999px;
    border:1px solid var(--line2); background:transparent; font-size:2.3vh;
    letter-spacing:.06em; color:var(--ink); cursor:pointer;
    transition:background .2s, border-color .2s, color .2s; }
  .tabs button.on { background:var(--amber); border-color:var(--amber); color:#17110E;
    font-weight:700; }

  /* ── 넘기는 영역 ── */
  .stage { position:relative; overflow:hidden; min-height:0; touch-action:pan-y; }
  /* 트랙 폭은 **무대와 같게** 둔다. 폭을 300%로 주면 페이지의
     flex-basis:100% 가 트랙 기준으로 잡혀 한 장이 3배로 늘어난다
     (항목이 화면 밖으로 밀려나 오른쪽이 잘린다).
     페이지들이 트랙을 넘치는 건 정상 — 무대가 잘라 준다. */
  .track { display:flex; height:100%; width:100%; will-change:transform;
    transition:transform 420ms cubic-bezier(.22,.61,.36,1); }
  /* 좌우 여백은 넘김 버튼 자리를 비켜야 한다 — 버튼이 메뉴 글자를 물면
     둘 다 읽기 어려워진다(버튼 오른쪽 끝 ≈ 7.1vw, 여기에 여유를 더 둔다) */
  .page { flex:0 0 100%; height:100%; min-width:0;
    padding:4vh 9.6vw 2.2vh; display:flex; flex-direction:column; gap:3.1vh;
    overflow:hidden; }
  .page h2 { margin:0; display:flex; align-items:center; gap:1.15vw; }
  .page h2 .en { font-family:var(--serif); font-size:3.7vh; letter-spacing:.22em;
    color:var(--ink-hi); white-space:nowrap; }
  .page h2 .ko { font-size:2.2vh; color:var(--mute); letter-spacing:.02em;
    white-space:nowrap; }
  .page h2 .rule { flex:1; height:1px; background:var(--line2); }

  .items { display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
    gap:2.2vh 4.5vw; align-content:space-evenly; flex:1; min-height:0; }
  /* 한 페이지에 8개를 넘으면 3열로 — 잘리는 것보다 작게라도 다 보이는 게 낫다 */
  .items.dense { grid-template-columns:repeat(3, minmax(0,1fr)); gap:1.7vh 3vw; }

  .it { min-width:0; }
  .it .nm { font-size:3.5vh; font-weight:700; color:var(--ink-hi); line-height:1.2;
    word-break:keep-all; }
  .items.dense .it .nm { font-size:2.9vh; }
  .it .ln { display:flex; align-items:baseline; gap:.85vw; margin-top:.9vh; }
  .it .sub { font-size:2.2vh; color:var(--mute); white-space:nowrap; }
  .items.dense .it .sub { font-size:1.9vh; }
  .it .dots { flex:1 1 .8vw; min-width:.8vw; height:1px; background:var(--line2); }
  .it .pr { font-size:3.3vh; font-weight:600; color:var(--amber); white-space:nowrap;
    font-variant-numeric:tabular-nums; }
  .items.dense .it .pr { font-size:2.8vh; }
  .it.out .nm, .it.out .pr { color:rgba(242,231,220,.32); text-decoration:line-through; }
  .it.out .sold { color:var(--terra); font-weight:700; text-decoration:none; }

  /* ── 좌우 넘김 버튼: 화면 양옆, 크게 ── */
  .arrow { position:absolute; top:50%; transform:translateY(-50%);
    width:5.6vw; height:5.6vw; max-width:108px; max-height:108px;
    border-radius:50%; border:1px solid rgba(242,231,220,.30);
    background:rgba(242,231,220,.07); backdrop-filter:blur(6px);
    color:var(--ink); font-size:4.4vh; line-height:1; font-family:var(--serif);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    z-index:5; transition:background .18s, border-color .18s, transform .18s;
    padding:0 0 .4vh; }
  .arrow:hover { background:rgba(232,185,143,.18); border-color:var(--amber); }
  .arrow:active { transform:translateY(-50%) scale(.94); }
  .arrow.l { left:1.5vw; }
  .arrow.r { right:1.5vw; }
  .arrow[disabled] { opacity:.22; cursor:default; }

  /* ── 발 ── */
  .foot { border-top:1px solid var(--line); background:rgba(242,231,220,.035);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 3.75vw; gap:2vw; position:relative; }
  .set { display:flex; align-items:center; gap:1.15vw; min-width:0; }
  .badge { font-size:2.1vh; letter-spacing:.14em; color:#17110E; background:var(--terra);
    padding:.55vh .73vw; border-radius:3px; white-space:nowrap; }
  .set .t { font-size:2.5vh; color:var(--ink-hi); white-space:nowrap; }
  .set .hi { font-size:2.5vh; font-weight:700; color:#17110E; background:var(--amber);
    padding:.55vh .83vw; border-radius:4px; white-space:nowrap; }
  .set .sm { font-size:2vh; color:var(--mute); white-space:nowrap; }

  .fr { display:flex; align-items:center; gap:1.4vw; }
  .dots-nav { display:flex; gap:.62vw; align-items:center; }
  .dots-nav i { width:1.3vh; height:1.3vh; border-radius:50%;
    background:rgba(242,231,220,.28); cursor:pointer; transition:.25s; }
  .dots-nav i.on { background:var(--amber); transform:scale(1.25); }
  .qr { display:flex; align-items:center; gap:.83vw; }
  .qr.off { display:none; }
  .qr .box { width:7.4vh; height:7.4vh; background:#fff; border-radius:6px; padding:.5vh;
    display:flex; }
  .qr .box svg { width:100%; height:100%; display:block; }
  .qr .tx { white-space:nowrap; }
  .qr .tx b { display:block; font-size:2vh; color:var(--ink-hi); font-weight:700; }
  .qr .tx span { display:block; font-size:1.7vh; color:var(--mute); margin-top:.3vh; }
</style>
</head>
<body>

<div class="board">

  <div class="top">
    <div class="brand">
      <div class="n">SLOW STEP</div>
      <div class="s">Roasting &amp; Baking</div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="stage" id="stage">
    <div class="track" id="track"></div>
    <button class="arrow l" id="prev" aria-label="이전">‹</button>
    <button class="arrow r" id="next" aria-label="다음">›</button>
  </div>

  <div class="foot">
    <div class="set">
      <span class="badge">SET MENU</span>
      <span class="t">음료 + 디저트 주문 시</span>
      <span class="hi">500원 할인</span>
      <span class="sm">디카페인 · 오트밀크 · 샷 추가 +500원 · 결제 시 번호만 남기시면 3% 적립</span>
    </div>
    <div class="fr">
      <div class="dots-nav" id="dots"></div>
      <div class="qr off" id="qrSlot">
        <div class="box" id="qr"></div>
        <div class="tx"><b>내 적립 내역</b><span>휴대폰으로 찍어보세요</span></div>
      </div>
    </div>
  </div>

</div>

<script>
  /* 메뉴는 서버(관리자 화면)의 것을 그대로 쓴다. 가격을 바꾸면 이 화면도 따라온다.
     서버에 닿지 못하면(시안 미리보기·네트워크 끊김) 내장 목록으로 그린다. */
  const API_BASE = location.origin.includes(":5500") ? "http://localhost:8000" : location.origin;
  const $ = (id) => document.getElementById(id);
  const won = (n) => (n || 0).toLocaleString("ko-KR");

  /* 페이지 구성 — [영문 제목, 한글 제목, 담을 카테고리들].
     비어 있는 페이지는 만들지 않는다(디저트가 없는 날 빈 장이 뜨면 안 된다). */
  const PAGES = [
    ["COFFEE",      "커피 · 콜드브루", ["coffee", "coldbrew"]],
    ["NON-COFFEE",  "논커피 · 티",     ["noncoffee", "tea"]],
    ["ADE & SWEET", "에이드 · 디저트", ["ade", "dessert"]],
  ];
  const CAT_KO = { coffee:"커피", coldbrew:"콜드브루", ade:"스무디 · 에이드",
                   noncoffee:"논커피", tea:"티", dessert:"디저트" };

  const FALLBACK = [
    ["아메리카노", 4000, "coffee", "hotice"], ["카페 라떼", 4500, "coffee", "hotice"],
    ["바닐라 라떼", 5000, "coffee", "hotice"], ["카페 모카", 5300, "coffee", "hotice"],
    ["콜드브루", 4500, "coldbrew", "ice"], ["콜드브루 라떼", 5000, "coldbrew", "ice"],
    ["콜드브루 슈페너", 5500, "coldbrew", "ice"],
    ["자몽 에이드", 5500, "ade", "ice"], ["레몬 에이드", 5500, "ade", "ice"],
    ["플레인 요거트 스무디", 5000, "ade", "ice"],
    ["초코 라떼", 5000, "noncoffee", "hotice"], ["말차 라떼", 5300, "noncoffee", "hotice"],
    ["얼그레이", 4500, "tea", "hotice"], ["캐모마일", 4500, "tea", "hotice"],
    ["플레인 휘낭시에", 2500, "dessert", "none"],
  ].map(([name, price, category, temp_option]) =>
    ({ name, price, category, temp_option, sold_out:false }));

  /* 온도 표시는 '고를 수 있을 때'만 의미가 있다.
     아이스 전용은 Only Ice, 둘 다 되면 Hot / Ice, 디저트는 표시 없음. */
  function subLabel(m){
    if(m.temp_option === "hotice") return "Hot / Ice";
    if(m.temp_option === "ice")    return "Only Ice";
    return "";
  }

  let pages = [];      // [{en, ko, items:[...]}]
  let page = 0;

  function render(items){
    const byCat = {};
    items.forEach(m => (byCat[m.category] = byCat[m.category] || []).push(m));

    pages = PAGES.map(([en, ko, keys]) => {
      const list = keys.flatMap(k => (byCat[k] || []).map(m => ({ ...m, _cat:k })));
      return { en, ko, items:list };
    }).filter(p => p.items.length);
    if(!pages.length) return;
    page = Math.min(page, pages.length - 1);

    $("track").innerHTML = pages.map(p => `
      <div class="page">
        <h2><span class="en">${p.en}</span><span class="ko">${p.ko}</span><span class="rule"></span></h2>
        <div class="items${p.items.length > 8 ? " dense" : ""}">
          ${p.items.map(m => {
            const sub = subLabel(m);
            return `<div class="it${m.sold_out ? " out" : ""}">
              <div class="nm">${m.name}</div>
              <div class="ln">
                <span class="sub">${m.sold_out ? '<span class="sold">SOLD OUT</span>' : sub}</span>
                <span class="dots"></span>
                <span class="pr">${won(m.price)}</span>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>`).join("");

    $("tabs").innerHTML = pages.map((p, i) =>
      `<button data-i="${i}">${p.en}</button>`).join("");
    $("dots").innerHTML = pages.map((_, i) => `<i data-i="${i}"></i>`).join("");
    paint();
  }

  function paint(){
    // 트랙 폭 = 무대 폭이므로 100%가 정확히 한 장이다
    $("track").style.transform = `translateX(${-page * 100}%)`;
    [...$("tabs").children].forEach((b, i) => b.classList.toggle("on", i === page));
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === page));
    $("prev").disabled = page === 0;
    $("next").disabled = page === pages.length - 1;
  }

  function go(n){
    if(!pages.length) return;
    page = Math.max(0, Math.min(pages.length - 1, n));
    paint();
    hold();                      // 손님이 넘겼으면 자동 넘김을 잠시 멈춘다
  }

  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if(b) go(+b.dataset.i); };
  $("dots").onclick = (e) => { const d = e.target.closest("i"); if(d) go(+d.dataset.i); };
  $("prev").onclick = () => go(page - 1);
  $("next").onclick = () => go(page + 1);
  document.addEventListener("keydown", (e) => {
    if(e.key === "ArrowLeft")  go(page - 1);
    if(e.key === "ArrowRight") go(page + 1);
  });

  /* 좌우로 밀어 넘기기 — 터치와 마우스 드래그 둘 다 받는다.
     60px 미만은 '누른 것'으로 보고 무시한다(스치기만 해도 넘어가면 답답하다). */
  let startX = null;
  const stage = $("stage");
  const down = (e) => { startX = (e.touches ? e.touches[0] : e).clientX; };
  const up = (e) => {
    if(startX === null) return;
    const dx = (e.changedTouches ? e.changedTouches[0] : e).clientX - startX;
    startX = null;
    if(Math.abs(dx) < 60) return;
    go(page + (dx < 0 ? 1 : -1));
  };
  stage.addEventListener("touchstart", down, { passive:true });
  stage.addEventListener("touchend", up, { passive:true });
  stage.addEventListener("mousedown", down);
  stage.addEventListener("mouseup", up);

  /* 자동 넘김 — 메뉴판은 아무도 안 만져도 전체를 보여줘야 한다.
     손님이 직접 넘긴 뒤에는 30초간 멈춘다(읽는 중에 넘어가면 성가시다). */
  const AUTO_MS = 14000, HOLD_MS = 30000;
  let holdUntil = 0;
  function hold(){ holdUntil = Date.now() + HOLD_MS; }
  setInterval(() => {
    if(!pages.length || Date.now() < holdUntil) return;
    page = (page + 1) % pages.length;
    paint();
  }, AUTO_MS);

  async function load(){
    render(FALLBACK);                      // 먼저 그려 둔다 — 서버가 느려도 빈 화면을 안 보인다
    try {
      const res = await fetch(API_BASE + "/api/v1/menu");
      if(res.ok){
        const items = await res.json();
        if(Array.isArray(items) && items.length) render(items);
      }
    } catch(e){ /* 서버에 못 닿아도 내장 목록으로 계속 보여준다 */ }

    try {
      const res = await fetch(API_BASE + "/api/v1/member-qr");
      if(res.ok){
        const { svg } = await res.json();
        if(svg){ $("qr").innerHTML = svg; $("qrSlot").classList.remove("off"); }
      }
    } catch(e){ /* QR은 없어도 메뉴판은 제 역할을 한다 */ }
  }

  load();
  // 가격·품절이 바뀔 수 있으므로 5분마다 조용히 갱신한다
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
