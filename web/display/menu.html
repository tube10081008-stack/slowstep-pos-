<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슬로우스텝 메뉴판</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  :root {
    --bg:#f4f6f9; --card:#ffffff; --card2:#f8fafc; --line:#e6e9ef; --txt:#161a25;
    --muted:#6b7280; --brand:#3b5bff; --brand-dk:#2846e6; --brand-soft:#eef2ff;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
    --sans:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden; }

  /* 화면 전체를 채우되, 요소 크기는 화면 높이(vh)에 비례시킨다.
     1920×1080에서 맞춘 비율이 다른 해상도에서도 그대로 유지된다. */
  .board { height:100vh; display:flex; flex-direction:column; padding:3.2vh 2.6vw; }

  /* ── 머리말 ── */
  .top { display:flex; align-items:center; gap:1.4vw; flex:0 0 auto;
    padding-bottom:2.2vh; border-bottom:2px solid var(--txt); }
  .top .logo { height:7.4vh; width:auto; display:block; }
  .top .who { flex:1; }
  .top .who b { display:block; font-size:2.6vh; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
  .top .who span { display:block; font-size:1.5vh; color:var(--muted); font-weight:500; margin-top:.4vh;
    letter-spacing:.02em; }
  .top .word { font-size:2vh; font-weight:800; letter-spacing:.42em; color:var(--muted);
    text-transform:uppercase; }

  /* ── 3단 본문 ── */
  .cols { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:0 2.4vw;
    padding:2.4vh 0 0; min-height:0; }
  .col { display:flex; flex-direction:column; gap:2.4vh; min-height:0; overflow:hidden; }

  .cat { display:flex; flex-direction:column; }
  .cat > h2 { margin:0 0 1.3vh; font-size:2.05vh; font-weight:800; letter-spacing:.16em;
    color:var(--brand); text-transform:uppercase; display:flex; align-items:center; gap:.7vw; }
  .cat > h2 em { font-style:normal; font-size:1.5vh; font-weight:600; color:var(--muted);
    letter-spacing:0; text-transform:none; }
  .cat > h2::after { content:""; flex:1; height:1px; background:var(--line); }

  .row { display:flex; align-items:baseline; gap:.7vw; padding:1.0vh 0; }
  .row + .row { border-top:1px solid var(--line); }
  .row .nm { font-size:min(2.6vh, 1.72vw); font-weight:600; letter-spacing:-.015em;
    line-height:1.25; white-space:nowrap; }
  .row .tag { font-size:1.3vh; font-weight:800; letter-spacing:.06em; padding:.25vh .45vw;
    border-radius:.6vh; flex:0 0 auto; position:relative; top:-.25vh; }
  .tag.hot { background:#fff1ec; color:#c2410c; }
  .tag.ice { background:var(--brand-soft); color:var(--brand-dk); }
  .row .dots { flex:1; border-bottom:1px dotted #cdd3de; height:1px; min-width:.8vw; }
  .row .pr { font-size:min(2.6vh, 1.72vw); font-weight:700; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; flex:0 0 auto; white-space:nowrap; }
  .row.out .nm, .row.out .pr { color:#b9bfca; text-decoration:line-through; }
  .row.out .tag { display:none; }
  .row .out-mark { font-size:1.3vh; font-weight:700; color:#b9bfca; }

  /* ── 꼬리말 ── */
  .foot { flex:0 0 auto; height:11vh; margin-top:1.6vh; padding-top:1.6vh;
    border-top:1px solid var(--line); display:flex; align-items:center; gap:1.6vw; }
  .note { flex:1; display:flex; flex-wrap:wrap; gap:.6vh 1.6vw; }
  .note .n { font-size:1.72vh; color:var(--muted); font-weight:500; }
  .note .n b { color:var(--txt); font-weight:700; }
  .note .n.hi { color:var(--brand-dk); }
  .qr-slot { display:flex; align-items:center; gap:.9vw; background:var(--card);
    border:1px solid var(--line); border-radius:1.4vh; padding:.9vh 1.1vw; box-shadow:var(--shadow); }
  .qr-slot .qr { width:7.4vh; height:7.4vh; flex:0 0 auto; display:block; }
  .qr-slot .qr svg { width:100%; height:100%; display:block; }
  .qr-slot .qr svg path { fill:var(--txt); }
  .qr-slot .tx b { display:block; font-size:1.75vh; font-weight:800; letter-spacing:-.01em; }
  .qr-slot .tx span { display:block; font-size:1.4vh; color:var(--muted); font-weight:500; margin-top:.4vh; }
  .qr-slot.off { visibility:hidden; }

  /* 4:3(1280×1024)에서 2단으로 줄여 봤더니 오히려 디저트 3줄이 잘렸다.
     1280px 폭이면 3단이 충분히 들어가므로 가로 화면에서는 항상 3단을 유지한다.
     세로로 세운 화면일 때만 2단으로 접는다. */
  @media (max-aspect-ratio: 1/1) {
    .cols { grid-template-columns:repeat(2,1fr); }
    .row { padding:.55vh 0; }
    .row .nm, .row .pr { font-size:min(1.7vh, 2.4vw); }
    .cat > h2 { font-size:1.5vh; margin-bottom:.7vh; }
    .col { gap:1.4vh; }
  }
</style>
</head>
<body>
<div class="board">

  <div class="top">
    <img class="logo" src="../assets/logo-lockup.png" alt="SLOW STEP · Roasting &amp; Baking" />
    <div class="who">
      <b>슬로우스텝</b>
      <span>ROASTING &amp; BAKING</span>
    </div>
    <div class="word">Menu</div>
  </div>

  <div class="cols" id="cols"></div>

  <div class="foot">
    <div class="note">
      <div class="n">모든 음료 <b>디카페인 · 오트밀크 · 샷 추가</b> 가능 <b>+500원</b></div>
      <div class="n">음료와 디저트를 함께 주문하시면 <b>500원 할인</b></div>
      <div class="n hi">결제하실 때 <b>휴대폰 번호</b>만 남기시면 <b>3% 적립</b></div>
    </div>
    <div class="qr-slot off" id="qrSlot">
      <div class="qr" id="qr"></div>
      <div class="tx">
        <b>내 적립 내역</b>
        <span>휴대폰으로 찍어보세요</span>
      </div>
    </div>
  </div>

</div>

<script>
  /* 메뉴는 서버(관리자 화면)의 것을 그대로 쓴다. 가격을 바꾸면 이 화면도 바로 따라온다.
     서버에 닿지 못하면(시안 미리보기·네트워크 끊김) 아래 내장 목록으로 그린다. */
  const API_BASE = location.origin.includes(":5500") ? "http://localhost:8000" : location.origin;

  const CATS = [
    ["coffee",    "커피",          ""],
    ["coldbrew",  "콜드브루",      ""],
    ["ade",       "스무디 · 에이드", ""],
    ["noncoffee", "논커피",        ""],
    ["tea",       "티",            ""],
    ["dessert",   "디저트",        ""],
  ];
  // 한 단에 어떤 카테고리를 담을지 — 줄 수가 고르게 나뉘도록 묶었다
  const COLUMNS = [["coffee", "coldbrew"], ["ade", "tea"], ["noncoffee", "dessert"]];

  const FALLBACK = [
    ["아메리카노", 4000, "coffee", "hotice"],
    ["카페 라떼", 4500, "coffee", "hotice"],
    ["바닐라 라떼", 5000, "coffee", "hotice"],
    ["오렌지 커피", 5000, "coffee", "ice"],
    ["오렌지 비앙코", 5500, "coffee", "ice"],
    ["골든애플커피", 5200, "coffee", "ice"],
    ["콜드브루", 4500, "coldbrew", "ice"],
    ["콜드브루 라떼", 5000, "coldbrew", "ice"],
    ["콜드브루 슈페너", 5500, "coldbrew", "ice"],
    ["콜드브루 라떼 슈페너", 5800, "coldbrew", "ice"],
    ["플레인 요거트 스무디", 5000, "ade", "ice"],
    ["딸기 요거트 스무디", 5500, "ade", "ice"],
    ["시트러스 요거트 스무디", 5500, "ade", "ice"],
    ["자몽 알갱이 에이드", 5500, "ade", "ice"],
    ["레드 청포도 스파클링", 5500, "ade", "ice"],
    ["토마토 바질 에이드", 5500, "ade", "ice"],
    ["쿨라임 민트 에이드", 5500, "ade", "ice"],
    ["아이스티", 4000, "noncoffee", "ice"],
    ["딸기 라떼", 4500, "noncoffee", "ice"],
    ["쫀득한 미숫가루 크림 라떼", 5500, "noncoffee", "ice"],
    ["딥초코멜로우 (기라델리)", 5500, "noncoffee", "hotice"],
    ["허니 자몽 크림 라떼", 5500, "noncoffee", "hotice"],
    ["히비스커스", 4000, "tea", "hotice"],
    ["루이보스", 4000, "tea", "hotice"],
    ["캐모마일", 4000, "tea", "hotice"],
    ["민트", 4000, "tea", "hotice"],
    ["플레인 휘낭시에", 2500, "dessert", "none"],
    ["꿀고구마 휘낭시에", 3000, "dessert", "none"],
    ["라즈베리크럼블 휘낭시에", 3200, "dessert", "none"],
    ["얼그레이 마들렌", 3000, "dessert", "none"],
    ["밀키 마들렌", 3000, "dessert", "none"],
  ].map(([name, price, category, temp_option]) =>
    ({ name, price, category, temp_option, sold_out:false }));

  const won = (n) => (n || 0).toLocaleString("ko-KR");
  const $ = (id) => document.getElementById(id);

  /* 온도 표시는 '고를 수 있을 때'만 의미가 있다.
     아이스 전용은 ICE 하나, 핫·아이스 둘 다 되면 둘 다, 디저트는 표시 없음. */
  function tags(temp){
    if(temp === "hotice") return '<span class="tag hot">HOT</span><span class="tag ice">ICE</span>';
    if(temp === "ice")    return '<span class="tag ice">ICE</span>';
    return "";
  }

  function render(items){
    const byCat = {};
    items.forEach(m => (byCat[m.category] = byCat[m.category] || []).push(m));
    const label = Object.fromEntries(CATS.map(([k, ko, sub]) => [k, [ko, sub]]));

    $("cols").innerHTML = COLUMNS.map(keys => `
      <div class="col">${keys.map(k => {
        const list = byCat[k] || [];
        if(!list.length) return "";
        const [ko, sub] = label[k] || [k, ""];
        return `<div class="cat">
          <h2>${ko}${sub ? `<em>${sub}</em>` : ""}</h2>
          ${list.map(m => `
            <div class="row${m.sold_out ? " out" : ""}">
              <span class="nm">${m.name}</span>
              ${m.sold_out ? '<span class="out-mark">품절</span>' : tags(m.temp_option)}
              <span class="dots"></span>
              <span class="pr">${won(m.price)}</span>
            </div>`).join("")}
        </div>`;
      }).join("")}</div>`).join("");
  }

  async function load(){
    render(FALLBACK);                      // 먼저 그려 둔다 — 서버가 느려도 빈 화면을 보이지 않는다
    try {
      const res = await fetch(API_BASE + "/api/v1/menu");
      if(res.ok){
        const items = await res.json();
        if(Array.isArray(items) && items.length) render(items);
      }
    } catch(e){ /* 서버에 못 닿아도 내장 목록으로 계속 보여준다 */ }

    try {
      const res = await fetch(API_BASE + "/api/v1/member-qr");
      if(res.ok){
        const { svg } = await res.json();
        if(svg){ $("qr").innerHTML = svg; $("qrSlot").classList.remove("off"); }
      }
    } catch(e){ /* QR은 없어도 메뉴판은 제 역할을 한다 */ }
  }

  load();
  // 가격·품절이 바뀔 수 있으므로 5분마다 조용히 갱신한다
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
