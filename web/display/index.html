<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슬로우스텝 · 고객 화면</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
  :root {
    --bg:#f4f6f9; --card:#fff; --card2:#f8fafc; --line:#e6e9ef; --txt:#161a25;
    --muted:#6b7280; --brand:#3b5bff; --brand-dk:#2846e6; --brand-soft:#eef2ff;
    --green:#16a34a; --gold:#f59e0b;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.07);
    --sans:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--txt); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden; }
  .screen { height:100vh; display:flex; flex-direction:column; padding:3vh 3vw; }
  .hidden { display:none !important; }

  /* 상단 브랜드 */
  .brand { display:flex; align-items:center; gap:14px; flex:0 0 auto; }
  .logo { width:44px; height:auto; flex:0 0 auto; display:block; }
  .wm { font-weight:800; font-size:22px; letter-spacing:-.02em; }
  .wm small { display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:2px; }
  .link { margin-left:auto; font-size:11px; font-weight:600; padding:5px 12px; border-radius:999px;
    background:var(--card2); color:var(--muted); border:1px solid var(--line); letter-spacing:.01em; }
  .link.on { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .link.off { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }

  /* ── 대기 화면 ── */
  #idle { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  #idle .big { font-size:clamp(34px,5.5vw,64px); font-weight:800; letter-spacing:-.03em; }
  #idle .sub { font-size:clamp(15px,1.7vw,21px); color:var(--muted); font-weight:500; letter-spacing:-.01em; }
  #idle .mark { width:auto; height:min(42vh,340px); display:block; }

  /* ── 주문 화면 ── */
  #order { flex:1; display:flex; flex-direction:column; margin-top:2.4vh; min-height:0; }
  .ttl { font-size:clamp(13px,1.3vw,16px); font-weight:600; color:var(--muted);
    margin-bottom:12px; letter-spacing:.02em; }
  .list { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:10px 22px; box-shadow:var(--shadow); }
  .li { display:flex; align-items:center; gap:14px; padding:2.1vh 0; border-bottom:1px solid var(--line); }
  .li:last-child { border-bottom:0; }
  .li .nm { flex:1; font-size:clamp(17px,2vw,26px); font-weight:700; letter-spacing:-.01em; }
  .li .nm em { font-style:normal; font-size:.62em; color:var(--muted); font-weight:600; margin-left:8px; }
  .li .qt { font-size:clamp(16px,1.8vw,23px); font-weight:800; color:var(--brand);
    min-width:2.6em; text-align:center; }
  .li .amt { font-size:clamp(16px,1.8vw,23px); font-weight:700; min-width:5.2em; text-align:right; }
  .empty { display:flex; height:100%; align-items:center; justify-content:center;
    color:var(--muted); font-size:clamp(16px,1.8vw,22px); }

  .sum { flex:0 0 auto; margin-top:2vh; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:2.2vh 22px; box-shadow:var(--shadow); }
  .row { display:flex; justify-content:space-between; align-items:baseline; }
  .row + .row { margin-top:9px; }
  .row .k { font-size:clamp(14px,1.4vw,18px); color:var(--muted); font-weight:600; }
  .row .v { font-size:clamp(15px,1.5vw,20px); font-weight:700; }
  .row.total .k { font-size:clamp(17px,1.8vw,24px); color:var(--txt); font-weight:800; }
  .row.total .v { font-size:clamp(30px,4.4vw,58px); font-weight:800; color:var(--brand); letter-spacing:-.03em; }
  .disc .k, .disc .v { color:var(--gold); }

  /* ── 결제: 손님 터치 입력 ── */
  #pay { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4vh; }
  .pay-top { display:flex; align-items:baseline; gap:16px; }
  .pay-top .lbl { font-size:clamp(14px,1.5vw,20px); color:var(--muted); font-weight:600; }
  .pay-top .amt { font-size:clamp(34px,5.6vw,72px); font-weight:800; color:var(--brand);
    letter-spacing:-.04em; line-height:1; }
  .ask-sm { font-size:clamp(16px,1.9vw,25px); font-weight:600; margin-top:.8vh; letter-spacing:-.015em; }
  .ask-sub { font-size:clamp(12px,1.3vw,16px); color:var(--muted); font-weight:500; margin-top:-.2vh; }
  .phone-disp { font-size:clamp(28px,4.4vw,54px); font-weight:800; letter-spacing:.06em;
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    padding:1.5vh 3vw; min-width:min(88vw,520px); text-align:center; box-shadow:var(--shadow); }
  .phone-disp .ph { color:#d4d9e3; }
  .phone-disp .sep { color:#d4d9e3; margin:0 .1em; }
  /* 터치 대상은 크게 — 손님이 서서 누른다 */
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:1.1vh 1.1vw;
    width:min(88vw,520px); margin-top:.6vh; }
  .pad button { font-family:inherit; font-size:clamp(24px,3.4vw,40px); font-weight:700;
    padding:1.9vh 0; border-radius:16px; border:1px solid var(--line); background:var(--card);
    color:var(--txt); cursor:pointer; box-shadow:0 1px 2px rgba(16,24,40,.05);
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .pad button:active { background:var(--brand-soft); border-color:var(--brand); transform:scale(.96); }
  .pad button.sm { font-size:clamp(13px,1.4vw,17px); font-weight:600; color:var(--muted); }
  .pad-act { display:flex; gap:1.1vw; width:min(88vw,520px); margin-top:.4vh; }
  .pad-act button { flex:1; font-family:inherit; font-size:clamp(16px,2vw,26px); font-weight:700;
    padding:2vh 0; border-radius:16px; cursor:pointer; border:1px solid var(--line);
    touch-action:manipulation; }
  .pad-act .skip { background:var(--card); color:var(--muted); }
  .pad-act .go { background:var(--brand); color:#fff; border-color:var(--brand); flex:1.7; }
  .pad-act .go:disabled { opacity:.4; }
  .pad-act button:active { transform:scale(.98); }
  .hint { font-size:clamp(11px,1.1vw,13px); color:var(--muted); margin-top:1vh; font-weight:500; letter-spacing:.01em; }
  .hint.err { color:#ef4444; font-weight:700; }

  /* ── 회원 인사 ── */
  #greet { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1vh; }
  #greet h1 { font-size:clamp(30px,4.6vw,58px); font-weight:800; letter-spacing:-.03em; }
  .g-badge { font-size:clamp(11px,1.2vw,14px); font-weight:700; padding:7px 18px; border-radius:999px;
    background:var(--brand-soft); color:var(--brand-dk); border:1px solid #dfe4ff; letter-spacing:.04em; }
  #pay .ask, #greet .ask { background:var(--brand-soft); border:1px solid #dfe4ff;
    color:var(--brand-dk); border-radius:16px; padding:1.8vh 3vw; font-size:clamp(15px,1.8vw,24px);
    font-weight:700; text-align:center; line-height:1.5; }

  /* ── 완료 화면 ── */
  #done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; }
  #done .check { width:104px; height:104px; border-radius:50%; background:#dcfce7; color:var(--green);
    display:flex; align-items:center; justify-content:center; font-size:56px; font-weight:800; }
  #done h1 { font-size:clamp(28px,4vw,50px); font-weight:800; letter-spacing:-.03em; }
  #done .who, #greet .who { font-size:clamp(15px,1.8vw,23px); color:var(--muted); font-weight:500; letter-spacing:-.01em; }
  .stats { display:flex; gap:2vw; margin-top:1.6vh; flex-wrap:wrap; justify-content:center; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:2.2vh 3vw; text-align:center; min-width:150px; box-shadow:var(--shadow); }
  .stat .k { font-size:clamp(11px,1.15vw,14px); color:var(--muted); font-weight:500; letter-spacing:.01em; }
  .stat .v { font-size:clamp(24px,3.2vw,42px); font-weight:800; margin-top:6px; letter-spacing:-.02em; }
  .stat .v.p { color:var(--brand); }
  .stat .v.g { color:var(--green); }
  .rewards { display:flex; flex-direction:column; gap:9px; margin-top:1.4vh; align-items:center; }
  .rw { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:999px;
    padding:10px 22px; font-size:clamp(13px,1.5vw,18px); font-weight:600; letter-spacing:-.01em; }
  .stamp-row { display:flex; gap:7px; margin-top:1.2vh; flex-wrap:wrap; justify-content:center; }
  .sd { width:clamp(30px,3.2vw,42px); height:clamp(30px,3.2vw,42px); color:#cfd5e1; }
  .sd svg { width:100%; height:100%; display:block; }
  .sd .cup-fill { fill:transparent; }
  .sd .steam { opacity:0; }
  .sd.on { color:var(--brand); }
  .sd.on .cup-fill { fill:var(--brand-soft); }
  .sd.on .steam { opacity:.85; }

    .foot { flex:0 0 auto; text-align:center; color:#b9bfcc; font-size:11px; margin-top:1.6vh;
    letter-spacing:.34em; font-weight:600; }
  @keyframes pop { from{ opacity:0; transform:scale(.96);} to{ opacity:1; transform:none;} }
  .screen > div { animation:pop .28s ease both; }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
<link rel="apple-touch-icon" href="../assets/favicon-180.png" />
</head>
<body>
<div class="screen">
  <div class="brand">
    <img class="logo" src="../assets/logo-mark.png" alt="슬로우스텝" />
    <div class="wm">Slowstep<small>슬로우스텝</small></div>
    <span class="link" id="link">연결 확인 중…</span>
  </div>

  <!-- 대기 -->
  <div id="idle">
    <img class="mark" src="../assets/logo-lockup.png" alt="SLOW STEP · Roasting &amp; Baking" />
    <div class="big">어서 오세요</div>
    <div class="sub">오늘도 천천히, 좋은 시간 되세요</div>
  </div>

  <!-- 주문 중 -->
  <div id="order" class="hidden">
    <div class="ttl">주문하신 메뉴</div>
    <div class="list" id="list"></div>
    <div class="sum">
      <div class="row disc hidden" id="discRow"><span class="k">세트 할인</span><span class="v" id="disc">-0원</span></div>
      <div class="row total"><span class="k">합계</span><span class="v" id="total">0원</span></div>
    </div>
  </div>

  <!-- 결제: 손님이 직접 연락처 입력 (터치) -->
  <div id="pay" class="hidden">
    <div class="pay-top">
      <span class="lbl">결제 금액</span>
      <span class="amt" id="payAmt">0원</span>
    </div>
    <div class="ask-sm">휴대폰 번호를 입력해 주세요</div>
    <div class="ask-sub">번호만 남기시면 포인트가 자동으로 쌓여요</div>
    <div class="phone-disp" id="phoneDisp"><span class="ph">010-0000-0000</span></div>
    <div class="pad" id="pad"></div>
    <div class="pad-act">
      <button class="skip" id="skipBtn">다음에 할게요</button>
      <button class="go" id="okBtn" disabled>확인</button>
    </div>
    <div class="hint" id="payHint">적립 외의 용도로 사용하지 않습니다</div>
  </div>

  <!-- 회원 확인 (입력 후) -->
  <div id="greet" class="hidden">
    <div class="g-badge" id="gTier"></div>
    <h1 id="gName"></h1>
    <div class="who" id="gInfo"></div>
    <div class="stats" id="gStats"></div>
    <div class="ask" style="margin-top:1.6vh">이제 결제를 도와드릴게요</div>
  </div>

  <!-- 완료 -->
  <div id="done" class="hidden">
    <div class="check">✓</div>
    <h1>감사합니다</h1>
    <div class="who" id="doneWho"></div>
    <div class="stats" id="doneStats"></div>
    <div class="rewards" id="doneRw"></div>
    <div class="stamp-row" id="doneStamps"></div>
  </div>

  <div class="foot" id="foot">SLOW&nbsp;&nbsp;STEP</div>
</div>

<script>
  /**
   * 고객 표시 화면.
   *
   * POS(직원 화면)와 **BroadcastChannel** 로만 통신한다 — 서버 API를 전혀 호출하지
   * 않으므로 PIN도 필요 없고, 이 페이지만으로는 어떤 고객 정보도 조회할 수 없다.
   * 같은 PC·같은 브라우저의 다른 창에서만 신호가 오므로 외부 노출 위험이 없다.
   */
  const $ = (id) => document.getElementById(id);
  const CUP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="cup-fill" d="M4.5 7.5h11v5.5a5.5 5.5 0 0 1-11 0V7.5Z"/><path d="M15.5 9h1.3a2.6 2.6 0 0 1 0 5.2h-1.3"/><path d="M3.5 19.5h13"/><path class="steam" d="M8.5 4.6c.5-.7.2-1.3 0-1.8M12 4.6c.5-.7.2-1.3 0-1.8"/></svg>`;
  const won = (n) => (n||0).toLocaleString("ko-KR") + "원";
  const VIEWS = ["idle","order","pay","greet","done"];

  function show(view){
    VIEWS.forEach(v => $(v).classList.toggle("hidden", v !== view));
    $("foot").classList.toggle("hidden", view === "done");
  }

  function tempLabel(t){ return t==="hot" ? "HOT" : (t==="ice" ? "ICE" : ""); }

  function renderOrder(d){
    const items = d.items || [];
    if(!items.length){ show("idle"); return; }
    $("list").innerHTML = items.map(i=>{
      const opts = [tempLabel(i.temp), i.decaf?"디카페인":"", i.oat?"오트밀크":"", i.shot?"샷추가":""]
        .filter(Boolean).join(" · ");
      return `<div class="li">
        <span class="nm">${i.name}${opts?`<em>${opts}</em>`:""}</span>
        <span class="qt">${i.qty}</span>
        <span class="amt">${won(i.total)}</span>
      </div>`;
    }).join("");
    $("discRow").classList.toggle("hidden", !(d.discount > 0));
    $("disc").textContent = "-" + won(d.discount);
    $("total").textContent = won(d.total);
    show("order");
  }

  function renderDone(d){
    const m = d.member;
    if(m){
      $("doneWho").textContent = `${m.name} 님, 또 뵙겠습니다`;
      $("doneStats").innerHTML = `
        <div class="stat"><div class="k">이번 적립</div><div class="v p">+${(d.earned||0).toLocaleString("ko-KR")}P</div></div>
        <div class="stat"><div class="k">모은 포인트</div><div class="v">${(m.points||0).toLocaleString("ko-KR")}P</div></div>
        <div class="stat"><div class="k">등급</div><div class="v g">${m.tier_display||m.tier||""}</div></div>`;
      $("doneRw").innerHTML = (d.rewards||[]).map(r=>`<div class="rw">${r.title} +${r.points}P</div>`).join("");
      const goal = m.stamp_goal || 10, on = m.stamps || 0;
      $("doneStamps").innerHTML = Array.from({length:goal},(_,i)=>
        `<span class="sd ${i<on?"on":""}">${CUP}</span>`).join("");
    } else {
      $("doneWho").textContent = "안녕히 가세요";
      $("doneStats").innerHTML = `<div class="stat"><div class="k">결제 금액</div><div class="v">${won(d.net)}</div></div>`;
      $("doneRw").innerHTML = ""; $("doneStamps").innerHTML = "";
    }
    show("done");
  }

  const ch = new BroadcastChannel("slowstep-pos");

  // ── 직원 화면(POS)과의 연결 감시 ──
  // 연결이 끊긴 채 손님이 '확인'을 눌러도 아무 반응이 없으면 안 되므로,
  // 상태를 표시하고 응답이 없으면 즉시 알린다.
  let paired = false, lastSeen = 0, ackTimer = null;
  function setLink(){
    const el = $("link");
    el.textContent = paired ? "직원 화면 연결됨" : "직원 화면 연결 안 됨";
    el.className = "link " + (paired ? "on" : "off");
  }
  function markSeen(){ paired = true; lastSeen = Date.now(); setLink(); }
  setInterval(()=>{
    ch.postMessage({ type:"hello" });                 // 살아있는지 물어봄
    if(paired && Date.now() - lastSeen > 12000) paired = false;
    setLink();
  }, 4000);
  // 첫 응답을 잠깐 기다린 뒤 상태를 확정한다(계속 '확인 중'에 머무르지 않도록)
  setTimeout(()=>{ if(!paired) setLink(); }, 1800);

  // ── 손님이 직접 누르는 연락처 입력 ──
  const PREFIX = "010";   // 손님이 뒷자리만 누르면 되도록 미리 채워둔다
  const LEN = 11;
  let buf = PREFIX;
  function paintPhone(){
    // 남은 자리를 회색 자리표시로 보여줘 몇 자리 더 눌러야 하는지 알 수 있게
    let html = "";
    for(let i=0;i<LEN;i++){
      if(i===3 || i===7) html += '<span class="sep">-</span>';
      html += i < buf.length ? buf[i] : '<span class="ph">·</span>';
    }
    $("phoneDisp").innerHTML = html;
    $("okBtn").disabled = buf.length < 10;
    // 직원 화면에도 입력 상황을 그대로 비춰준다(손님이 헤매면 도와줄 수 있게)
    ch.postMessage({ type:"phone_input", phone: buf });
  }
  function hint(msg, isErr){
    const h = $("payHint");
    h.textContent = msg || "적립 외의 용도로 사용하지 않습니다";
    h.className = "hint" + (isErr ? " err" : "");
  }
  function resetPad(){ buf = PREFIX; paintPhone(); hint(""); }

  (function buildPad(){
    const pad = $("pad");
    const mk = (label, fn, cls) => {
      const b = document.createElement("button");
      b.textContent = label; if(cls) b.className = cls;
      b.onclick = fn; pad.appendChild(b);
    };
    for(let i=1;i<=9;i++) mk(String(i), ()=>{ if(buf.length<11){ buf+=String(i); paintPhone(); } });
    mk("←", ()=>{ buf = buf.slice(0,-1); paintPhone(); });
    mk("0", ()=>{ if(buf.length<11){ buf+="0"; paintPhone(); } });
    mk("전체 지움", ()=>{ buf=PREFIX; paintPhone(); }, "sm");
  })();

  $("okBtn").onclick = ()=>{
    if(buf.length < 10) return;
    if(!paired){ hint("직원 화면과 연결되어 있지 않아요. 직원을 불러주세요.", true); return; }
    hint("확인 중이에요…");
    ch.postMessage({ type:"phone_submit", phone: buf });
    clearTimeout(ackTimer);
    ackTimer = setTimeout(()=> hint("응답이 없어요. 직원을 불러주세요.", true), 2500);
  };
  $("skipBtn").onclick = ()=>{
    if(!paired){ hint("직원 화면과 연결되어 있지 않아요. 직원을 불러주세요.", true); return; }
    ch.postMessage({ type:"guest" });
  };

  function renderGreet(m){
    $("gTier").textContent = m.tier_display || m.tier || "회원";
    $("gName").textContent = `${m.name} 님, 반갑습니다`;
    $("gInfo").textContent = m.visit_count > 0
      ? `${m.visit_count}번 찾아주셨어요 · 스탬프 ${m.stamps}/${m.stamp_goal}`
      : "첫 방문을 환영합니다";
    $("gStats").innerHTML = `
      <div class="stat"><div class="k">지금 쓸 수 있는 포인트</div><div class="v p">${(m.points||0).toLocaleString("ko-KR")}P</div></div>`;
    show("greet");
  }

  ch.onmessage = (e) => {
    const d = e.data || {};
    if(d.type === "hello") return;      // 다른 고객 화면의 문의는 무시
    markSeen();
    if(["greet","guest_ok","lookup_fail"].includes(d.type)) clearTimeout(ackTimer);
    if(d.type === "cart")      renderOrder(d);
    else if(d.type === "pay")  { $("payAmt").textContent = won(d.total); resetPad(); show("pay"); }
    else if(d.type === "greet")   renderGreet(d.member);
    else if(d.type === "guest_ok"){ show("greet"); $("gTier").textContent="적립 없이 결제";
      $("gName").textContent="결제를 도와드릴게요"; $("gInfo").textContent="다음에 번호를 남겨주시면 적립해 드릴게요";
      $("gStats").innerHTML=""; }
    else if(d.type === "lookup_fail"){ hint(d.message || "처음 오셨군요. 직원이 도와드릴게요.", true); }
    else if(d.type === "done") renderDone(d);
    else if(d.type === "idle") show("idle");
  };
  // POS가 이미 켜져 있으면 현재 상태를 다시 보내달라고 요청
  ch.postMessage({ type: "hello" });
  show("idle");
</script>
</body>
</html>
